<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boo on Demand - Delivery Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .delivery-option {
            margin-bottom: 20px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .delivery-option:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .delivery-option.selected {
            border-color: #667eea;
            background-color: #f0f3ff;
        }

        .option-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .radio-custom {
            width: 20px;
            height: 20px;
            border: 2px solid #667eea;
            border-radius: 50%;
            margin-right: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .radio-custom::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #667eea;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .delivery-option.selected .radio-custom::after {
            opacity: 1;
        }

        .option-label {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
        }

        .option-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            margin-top: 10px;
            display: none;
        }

        .delivery-option.selected .option-input {
            display: block;
        }

        .option-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .confirm-button {
            width: 100%;
            padding: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
            opacity: 0.5;
            pointer-events: none;
        }

        .confirm-button.active {
            opacity: 1;
            pointer-events: auto;
        }

        .confirm-button.active:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .confirm-button:active {
            transform: translateY(0);
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👻 Boo on Demand</h1>
        <p class="subtitle">Choose your delivery time</p>

        <div class="delivery-option" data-option="now">
            <div class="option-header">
                <div class="radio-custom"></div>
                <div class="option-label">Delivery Now</div>
            </div>
        </div>

        <div class="delivery-option" data-option="later-today">
            <div class="option-header">
                <div class="radio-custom"></div>
                <div class="option-label">Later Today</div>
            </div>
            <input type="text" class="option-input" placeholder="Enter time (e.g., 3:00 PM)" data-input="later-today">
        </div>

        <div class="delivery-option" data-option="tomorrow">
            <div class="option-header">
                <div class="radio-custom"></div>
                <div class="option-label">Tomorrow</div>
            </div>
            <input type="text" class="option-input" placeholder="Enter time (e.g., 10:00 AM)" data-input="tomorrow">
        </div>

        <div class="delivery-option" data-option="custom">
            <div class="option-header">
                <div class="radio-custom"></div>
                <div class="option-label">Something Else</div>
            </div>
            <input type="text" class="option-input" placeholder="Enter custom date/time" data-input="custom">
        </div>

        <button class="confirm-button" id="confirmBtn">Confirm Delivery</button>

        <div class="status-message" id="statusMessage"></div>
    </div>

    <script>
        const options = document.querySelectorAll('.delivery-option');
        const confirmBtn = document.getElementById('confirmBtn');
        const statusMessage = document.getElementById('statusMessage');
        let selectedOption = null;
        let selectedInput = null;

        // Handle option selection
        options.forEach(option => {
            const input = option.querySelector('.option-input');

            option.addEventListener('click', (e) => {
                // Don't trigger if clicking on input
                if (e.target.classList.contains('option-input')) return;

                // Deselect all options
                options.forEach(opt => opt.classList.remove('selected'));

                // Select clicked option
                option.classList.add('selected');
                selectedOption = option.dataset.option;
                selectedInput = input;

                // Focus input if exists
                if (input) {
                    setTimeout(() => input.focus(), 100);
                }

                checkValidity();
            });

            // Handle input changes
            if (input) {
                input.addEventListener('input', checkValidity);
            }
        });

        // Check if form is valid
        function checkValidity() {
            if (!selectedOption) {
                confirmBtn.classList.remove('active');
                return;
            }

            // If "now" is selected, always valid
            if (selectedOption === 'now') {
                confirmBtn.classList.add('active');
                return;
            }

            // For other options, check if input has value
            if (selectedInput && selectedInput.value.trim()) {
                confirmBtn.classList.add('active');
            } else {
                confirmBtn.classList.remove('active');
            }
        }

        // Handle confirm button click
        confirmBtn.addEventListener('click', async () => {
            if (!confirmBtn.classList.contains('active')) return;

            let deliveryDetails = '';

            switch(selectedOption) {
                case 'now':
                    deliveryDetails = 'Delivery Now - Immediate delivery requested';
                    break;
                case 'later-today':
                    deliveryDetails = `Later Today - ${selectedInput.value.trim()}`;
                    break;
                case 'tomorrow':
                    deliveryDetails = `Tomorrow - ${selectedInput.value.trim()}`;
                    break;
                case 'custom':
                    deliveryDetails = `Custom - ${selectedInput.value.trim()}`;
                    break;
            }

            try {
                const response = await fetch('https://notify.mtib.dev/message/markus-mm-notify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: 'boo-on-demand',
                        content: `Delivery option was picked: ${deliveryDetails}`
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Hide all delivery options
                    options.forEach(opt => opt.style.display = 'none');

                    // Hide confirm button
                    confirmBtn.style.display = 'none';

                    // Show success message with thank you
                    statusMessage.className = 'status-message success';
                    statusMessage.textContent = '✓ Delivery scheduled successfully! Thank you for using Boo on Demand. Your order will arrive soon!';
                } else {
                    throw new Error(data.error || 'Failed to schedule delivery');
                }
            } catch (error) {
                statusMessage.className = 'status-message error';
                statusMessage.textContent = `✗ Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
